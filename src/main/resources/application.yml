spring:
  application:
    name: flight-crew-scheduler

  datasource:
    url: jdbc:h2:mem:crewscheduler;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.skylink.crewscheduler: INFO
    org.springframework.security: WARN
